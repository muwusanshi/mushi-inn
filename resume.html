<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人简历 · 木石客栈</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="resume" data-title="个人简历">

<div class="bg-layer"></div>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mascot">🌸</div>
    <div class="gate-title">欢迎来到 木石客栈</div>
    <div class="gate-sub">进来需要一句暗号</div>
    <input class="gate-input" id="gateInput" type="password" placeholder="请输入进站口令" autocomplete="off">
    <div class="gate-error" id="gateError"></div>
    <button class="btn btn-primary btn-block" id="gateOpen">进入客栈</button>
  </div>
</div>

<header class="site-header">
  <div class="container">
    <nav class="nav">
      <a class="brand" href="index.html"><span class="brand-mark">🌸</span>木石客栈</a>
      <div class="nav-links">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link" href="list.html">全部文件</a>
      </div>
      <div class="nav-actions">
        <button class="icon-btn" id="themeBtn" title="切换主题">☀️</button>
      </div>
    </nav>
  </div>
</header>

<main class="section">
  <div class="container resume-box">
    <!-- 简历独立锁：需要密码才能解密显示 -->
    <div class="card resume-content" id="resumeLock" style="text-align:center">
      <div style="font-size:40px">🔒</div>
      <h2 style="margin-top:10px">个人简历（加密）</h2>
      <p style="color:var(--text-dim);margin-top:8px">这份简历经过浏览器端加密，需要密码才能查看</p>
      <input class="gate-input" id="resumePw" type="password" placeholder="请输入简历密码" autocomplete="off" style="max-width:300px;margin-top:16px">
      <button class="btn btn-primary btn-block" id="resumeGo" style="max-width:300px;margin:12px auto 0">解密查看</button>
    </div>
    <div id="resumeWrap"></div>
  </div>
</main>

<footer class="footer">
  <div class="container" style="text-align:center">
    <div id="footName">木石客栈</div>
    <div id="footNote">木石客栈 · 欢迎常来</div>
    <div style="margin-top:6px">© <span id="year">2026</span></div>
  </div>
</footer>

<div class="mascot" id="mascot">
  <div class="mascot-bubble" id="mascotBubble">欢迎～</div>
  <div class="mascot-img" id="mascotImg">🌸</div>
</div>

<script src="assets/js/crypto.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/resume-data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
